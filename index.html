<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klyn</title>
<meta name="description" content="Klyn keeps your folders tidy, automatically. For Windows.">
<link rel="icon" href="klyn.png">
<style>
  :root { --bg: #f6f6f3; --ink: #1b1b19; --muted: #5f5f5a; --accent: #2f7d6d; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --ink: #ededea; --muted: #a3a39c; --accent: #7fc3b2; } }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    text-align: center;
  }
  main { padding: 40px 16px; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { margin: 12px 0 4px; font-size: 32px; }
  p { margin: 0 0 18px; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="klyn.png" alt="">
  <h1>Klyn</h1>
  <p>Keeps your folders tidy, automatically. For Windows.</p>
  <a href="privacy/">Privacy policy · Kebijakan privasi</a>
</main>
</body>
</html>
