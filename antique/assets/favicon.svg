<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Ikon Antique. Sumber untuk `pnpm tauri icon` (lihat README di folder ini). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1613"/>
      <stop offset="45%" stop-color="#0b0908"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <radialGradient id="warmth" cx="50%" cy="52.7%" r="48%">
      <stop offset="0%" stop-color="#ff8a2a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff8a2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sclera" cx="50%" cy="58%" r="70%">
      <stop offset="0%" stop-color="#fff6e4"/>
      <stop offset="80%" stop-color="#fbe8c8"/>
      <stop offset="100%" stop-color="#e9cfa3"/>
    </radialGradient>
    <radialGradient id="iris">
      <stop offset="0%" stop-color="#ffd98a"/>
      <stop offset="55%" stop-color="#e8701a"/>
      <stop offset="100%" stop-color="#7a2604"/>
    </radialGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4a1a" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#7a4a1a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowWide" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="glowTight" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#warmth)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="206.5" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="3"/>

  <g>
    <rect x="176.2" y="422.4" width="303.8" height="235.2" rx="117.6" fill="#ff9b3d" opacity="0.55" filter="url(#glowWide)"/>
    <rect x="176.2" y="422.4" width="303.8" height="235.2" rx="117.6" fill="#ffb460" opacity="0.9" filter="url(#glowTight)"/>
    <clipPath id="eye0"><rect x="176.2" y="422.4" width="303.8" height="235.2" rx="117.6"/></clipPath>
    <g clip-path="url(#eye0)">
      <rect x="156.2" y="402.4" width="343.8" height="275.2" fill="url(#sclera)"/>
      <g transform="translate(328.1 537.6) scale(1.8620)">
        <circle r="50" fill="url(#iris)"/>
        <circle r="48" fill="none" stroke="#5a1a02" stroke-width="3" opacity="0.6"/>
        <circle r="21" fill="#241003"/>
        <circle cx="15" cy="-17" r="8.5" fill="#fff" opacity="0.9"/>
        <circle cx="-13" cy="15" r="3.6" fill="#fff" opacity="0.5"/>
      </g>
      <!-- bayangan kelopak atas yang lembut -->
      <rect x="176.2" y="422.4" width="303.8" height="235.2" fill="url(#lid)"/>
    </g>
  </g>
  <g>
    <rect x="544.0" y="422.4" width="303.8" height="235.2" rx="117.6" fill="#ff9b3d" opacity="0.55" filter="url(#glowWide)"/>
    <rect x="544.0" y="422.4" width="303.8" height="235.2" rx="117.6" fill="#ffb460" opacity="0.9" filter="url(#glowTight)"/>
    <clipPath id="eye1"><rect x="544.0" y="422.4" width="303.8" height="235.2" rx="117.6"/></clipPath>
    <g clip-path="url(#eye1)">
      <rect x="524.0" y="402.4" width="343.8" height="275.2" fill="url(#sclera)"/>
      <g transform="translate(695.9 537.6) scale(1.8620)">
        <circle r="50" fill="url(#iris)"/>
        <circle r="48" fill="none" stroke="#5a1a02" stroke-width="3" opacity="0.6"/>
        <circle r="21" fill="#241003"/>
        <circle cx="15" cy="-17" r="8.5" fill="#fff" opacity="0.9"/>
        <circle cx="-13" cy="15" r="3.6" fill="#fff" opacity="0.5"/>
      </g>
      <!-- bayangan kelopak atas yang lembut -->
      <rect x="544.0" y="422.4" width="303.8" height="235.2" fill="url(#lid)"/>
    </g>
  </g>
</svg>
